image: python:3.12-slim

stages:
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

pages:
  stage: deploy
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - python -m pip install -r docs/requirements.txt
  script:
    # Build Sphinx HTML into the GitLab Pages "public" folder
    - sphinx-build -b html docs public
  artifacts:
    paths:
      - public
  only:
    - main
    - master
    - tags

