image: python:3.12-slim

stages:
  - deploy

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

pages:
  stage: deploy
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - python -m pip install -r docs/requirements.txt
  script:
    - rm -rf public
    - mkdir -p public
    # Build Sphinx HTML into the GitLab Pages "public" folder
    - sphinx-build -b html docs public
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master)$/ || $CI_COMMIT_TAG'
